[project]
name = "triage-mesh"
version = "0.1.0"
description = "Multi-agent vulnerability triage over MCP + A2A with a deterministic security harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.15",
    "a2a-sdk>=0.3",
    "anthropic>=0.40",
    "pyyaml>=6.0.3",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
