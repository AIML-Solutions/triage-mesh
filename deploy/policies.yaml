# Tool-call policy: the single source of truth for who may call what, with
# which arguments, how often. Enforced deterministically by the harness
# (triage_mesh.harness.policy) BEFORE any call leaves an agent — the model
# cannot talk its way past it. Deny-by-default: an agent or tool absent from
# this file is refused. Phase 3 generates K8s NetworkPolicies from the same
# topology this file declares.

# Who may open a connection to whom (service -> [service:port]). The compose
# networks and the generated K8s NetworkPolicies (scripts/gen_networkpolicies.py
# -> deploy/chart/templates/networkpolicies.yaml) both derive from this block;
# everything not listed is default-deny. internet_egress marks the single
# service allowed to reach outside the cluster (OSV queries).
topology:
  services:
    orchestrator: {port: 8080, external_ingress: true}
    scanner: {port: 7201}
    intel: {port: 7202}
    assessor: {port: 7203}
    mcp-repo-reader: {port: 7101}
    mcp-vuln-intel: {port: 7102, internet_egress: true}
    mcp-report-writer: {port: 7103}
  edges:
    orchestrator: [scanner, intel, assessor]
    scanner: [mcp-repo-reader]
    intel: [mcp-vuln-intel]
    assessor: [mcp-report-writer]

agents:
  scanner:
    max_calls_per_task: 20
    tools:
      list_manifests: {}
      read_manifest:
        args:
          filename:
            enum: [requirements.txt, package-lock.json]

  intel:
    max_calls_per_task: 60
    tools:
      query_advisories:
        args:
          ecosystem:
            enum: [PyPI, npm]
          name:
            pattern: '^[A-Za-z0-9@][A-Za-z0-9@/._-]{0,213}$'
          version:
            pattern: '^[A-Za-z0-9.!+*-]{1,64}$'

  assessor:
    max_calls_per_task: 5
    tools:
      write_draft:
        args:
          report:
            max_bytes: 1048576
