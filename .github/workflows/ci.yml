name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --frozen
      - name: Unit and integration tests
        run: uv run pytest -q --ignore=tests/redteam
      - name: Red-team suite (12 attack scenarios must fail closed)
        run: uv run pytest tests/redteam -q
