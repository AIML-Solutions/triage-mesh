[project]
name = "triage-mesh"
version = "0.2.0"
description = "Multi-agent vulnerability triage over MCP + A2A with a deterministic security harness"
readme = "README.md"
license = "MIT"
authors = [{ name = "Dennis Donaghy" }]
keywords = ["ai-agents", "mcp", "a2a", "security", "prompt-injection", "kubernetes"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.15",
    "a2a-sdk>=0.3",
    "anthropic>=0.40",
    "pyyaml>=6.0.3",
    "pyjwt>=2.13.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[project.urls]
Repository = "https://github.com/AIML-Solutions/triage-mesh"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
